name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_PATH: /opt/daily-planner
          REPO_SSH_URL: git@github.com:qizhangumich/daily-planner.git
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" <<EOF
          set -e
          cd "${DEPLOY_PATH}"
          git remote set-url origin "${REPO_SSH_URL}"
          git fetch origin main
          git pull --rebase --autostash origin main
          docker compose up -d --build
          docker ps --filter name=telegram-notion-daily-assistant
          EOF
